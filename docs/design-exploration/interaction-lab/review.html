<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interaction viewport review</title><style>body{margin:0;background:#dddfe3;font:14px Arial}nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:10px}button{padding:10px}iframe{display:block;margin:auto;width:390px;height:780px;border:0;background:white}</style></head><body><nav><button data-src="worlds.html">Worlds</button><button data-src="direct.html">Index</button><button data-width="320">320px</button><button data-width="390">390px</button><button data-width="1024">1024px</button><button id="reduce">Reduced motion</button><output id="measurement" style="display:block;text-align:center;padding-bottom:10px;font-size:12px"></output></nav><iframe src="worlds.html" title="Interaction concept viewport"></iframe><script>const frame=document.querySelector('iframe');addEventListener('message',event=>{if(event.origin===location.origin&&event.data.type==='interaction-layout')document.querySelector('#measurement').textContent=event.data.width+' × '+event.data.height+' / content '+event.data.content+' / '+event.data.focus;});document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>frame.style.width=b.dataset.width+'px');document.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>frame.src=b.dataset.src+(frame.src.includes('motion=reduce')?'?motion=reduce':''));document.querySelector('#reduce').onclick=()=>{const url=new URL(frame.src);url.searchParams.set('motion','reduce');frame.src=url.href;};</script></body></html>
