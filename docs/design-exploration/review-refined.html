<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Refined A responsive review</title><style>body{margin:0;background:#d8d9d2;font:14px Arial}nav{display:flex;gap:10px;padding:10px;justify-content:center}button{padding:9px 14px}iframe{display:block;border:0;margin:0 auto;width:390px;height:1300px;background:white}</style></head><body><nav aria-label="Review width"><button data-width="320">320px</button><button data-width="390">390px</button><button data-width="1024">1024px</button></nav><iframe id="frame" src="a-refined.html" title="Refined A viewport"></iframe><script>document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>document.querySelector('iframe').style.width=button.dataset.width+'px'));</script></body></html>
